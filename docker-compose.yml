# Expediente no Docker local.
#
# Suba com `npm run docker:up`: o script detecta as contas do Claude Code no host e gera o
# docker-compose.override.yml (fora do controle de versão) com:
#   - montagens SOMENTE LEITURA de <conta>/projects e <conta>/sessions em /claude/<conta>/...
#     (nunca a pasta inteira da conta: lá ficam credenciais e configurações) e de ~/.expediente/usage
#     (uso de 5h/semanal capturado pelo tap de statusline) em /usage;
#   - EXPEDIENTE_CLAUDE_DIRS, EXPEDIENTE_ACCOUNTS e EXPEDIENTE_USAGE_DIR.
# O Compose mescla o override automaticamente em qualquer `docker compose ...` rodado nesta pasta.
name: expediente

services:
  expediente:
    build: .
    image: expediente:local
    container_name: expediente
    restart: unless-stopped
    # Os transcripts são sensíveis: por padrão a porta é publicada SÓ na interface local do host
    # (EXPEDIENTE_BIND=0.0.0.0 no .env libera a rede local; veja o README).
    ports:
      - "${EXPEDIENTE_BIND:-127.0.0.1}:${EXPEDIENTE_PORT:-4848}:4848"
    volumes:
      - expediente-data:/data
    # Opções que podem vir do .env (ou do ambiente) para dentro do container.
    environment:
      EXPEDIENTE_ALLOWED_HOSTS: ${EXPEDIENTE_ALLOWED_HOSTS:-}
      EXPEDIENTE_DEMO: ${EXPEDIENTE_DEMO:-}
      # O mesmo valor da porta publicada acima: o terminal somente leitura só liga com bind local.
      EXPEDIENTE_BIND: ${EXPEDIENTE_BIND:-127.0.0.1}
      EXPEDIENTE_TERMINAL: ${EXPEDIENTE_TERMINAL:-}
    # Endurecimento: sistema de arquivos só leitura (exceto /data e /tmp), sem capabilities extras.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Processo init mínimo: repassa sinais e recolhe processos órfãos.
    init: true

volumes:
  expediente-data:
